name: Secret hygiene
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject tracked wallet secrets and obvious key literals
        run: python scripts/check_secret_hygiene.py
